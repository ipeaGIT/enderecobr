[package]
name = 'enderecobr'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.81'

[lib]
crate-type = [ "rlib", "staticlib" ]
name = 'enderecobr'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
enderecobr_rs = "0.2.0"
extendr-api = '0.9.0'
rustc-hash = "2.1.1"

[profile.release]
lto = true
codegen-units = 1
