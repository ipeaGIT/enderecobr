[package]
edition = "2021"
rust-version = "1.81"
name = "enderecobr_rs"
version = "0.2.0"
authors = [
    "Daniel Herszenhut Meirelles Santos <daniel.santos@ipea.gov.br>",
    "Gabriel Garcia de Almeida <gabriel.almeida@ipea.gov.br",
    "Rafael Henrique Moraes Pereira <rafael.pereira@ipea.gov.br>",
]
build = false
exclude = [
    "scripts/",
    "datasets/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Esta biblioteca tem por objetivo prover de funções utilizadas para padronizar endereços brasileiros, afim de facilitar processamentos posteriores."
homepage = "https://github.com/ipeaGIT/enderecobr_rs"
documentation = "https://docs.rs/enderecobr_rs"
readme = "README.md"
keywords = [
    "address",
    "brazil",
    "brasil",
    "regex",
    "geocoding",
]
categories = [
    "text-processing",
    "value-formatting",
    "science::geo",
]
license = "MIT"
repository = "https://github.com/ipeaGIT/enderecobr_rs"

[features]
cli = ["clap"]
default = []
experimental = ["crfsuite"]
polars_cli = [
    "clap",
    "polars",
]

[lib]
name = "enderecobr_rs"
path = "src/lib.rs"

[[bin]]
name = "bench-separacao"
path = "src/bin/bench-separacao.rs"
required-features = [
    "experimental",
    "polars_cli",
]

[[bin]]
name = "padronizacao-lote"
path = "src/bin/padronizacao-lote.rs"
required-features = ["polars_cli"]

[[bin]]
name = "padronizar"
path = "src/bin/padronizar.rs"
required-features = ["cli"]

[[bin]]
name = "separacao-lote"
path = "src/bin/separacao-lote.rs"
required-features = [
    "experimental",
    "polars_cli",
]

[[bin]]
name = "teste-comparativo"
path = "src/bin/teste-comparativo.rs"
required-features = ["polars_cli"]

[[bench]]
name = "numero_extenso_bench"
path = "benches/numero_extenso_bench.rs"
harness = false

[[bench]]
name = "padronizador_bench"
path = "benches/padronizador_bench.rs"
harness = false

[dependencies.clap]
version = "4.6.6"
features = ["derive"]
optional = true

[dependencies.crfsuite]
version = "0.3.2"
optional = true

[dependencies.diacritics]
version = "0.2.2"

[dependencies.itertools]
version = "0.15.0"

[dependencies.polars]
version = "0.52.0"
features = [
    "lazy",
    "parquet",
    "timezones",
]
optional = true

[dependencies.regex]
version = "1.13.1"

[dependencies.rustc-hash]
version = "2.1.3"

[dependencies.unicode-normalization]
version = "0.1.25"

[dev-dependencies.criterion]
version = "0.8.2"

