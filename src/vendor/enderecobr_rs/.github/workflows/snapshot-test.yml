name: Snapshot Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rodar Teste
        id: runmake
        run: |
          set +e
          OUTPUT=$(make -s -j 4 snapshot-test)
          echo "output<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Postar comentário no PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ steps.runmake.outputs.output }}
        run: |
          gh api repos/${GH_REPO}/issues/${{ github.event.pull_request.number }}/comments -f body="$PR_BODY"
